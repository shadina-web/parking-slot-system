<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard | College Parking</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar">

    <div class="brand">
        🅿️ College Parking
    </div>

    <div>

        <span>
            Welcome, {{ name }}
        </span>

        <a class="logout"
           href="{{ url_for('logout') }}">
            Logout
        </a>

    </div>

</nav>

<div class="dashboard">

    <h1>Welcome, {{ name }} 👋</h1>

    <p>
        Role: <strong>{{ role }}</strong>
    </p>

    <div class="dashboard-grid">

        <div class="dashboard-card">
            <div class="card-icon">🅿️</div>
            <h2>Parking Slots</h2>
            <p>View available parking slots</p>
            <a href="{{ url_for('parking_slots') }}"
   class="dashboard-button">
    View Slots
</a>
        </div>

        <div class="dashboard-card">
            <div class="card-icon">🚗</div>
            <h2>My Vehicles</h2>
            <p>Register and manage vehicles</p>
            <a href="{{ url_for('my_vehicles') }}"
               class="dashboard-button">
                My Vehicles
            </a>
        </div>

        <div class="dashboard-card">
            <div class="card-icon">📅</div>
            <h2>My Bookings</h2>
            <p>View your parking bookings</p>
            <a href="{{ url_for('my_bookings') }}"
               class="dashboard-button">
                My Bookings
            </a>
        </div>

    </div>

</div>

</body>

</html>

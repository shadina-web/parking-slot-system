<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | College Parking</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo">
            🅿️
        </div>

        <h1>Create Account</h1>

        <p class="subtitle">
            College Parking System
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% for category, message in messages %}

                <div class="alert {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endwith %}

        <form method="POST"
              action="{{ url_for('register') }}">

            <label>Full Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Phone</label>

            <input
                type="tel"
                name="phone"
                placeholder="Enter phone number"
                required
            >

            <label>Role</label>

            <select name="role" required>

                <option value="student">
                    Student
                </option>

                <option value="staff">
                    Staff
                </option>

            </select>

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Create password"
                required
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <p class="switch-page">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>

    </div>

</div>

</body>

</html>
